services:
  nginx:
    container_name: ${NGINX_SERVICE_NAME}
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./certbot/data/conf:/etc/letsencrypt
      - ./certbot/data/www:/var/www/certbot
    # Reload nginx every 6h so it picks up renewed certificates from certbot.
    # $${!} is the PID of the last background job (Docker Compose escapes $$ → $).
    command: >
      /bin/sh -c "while :; do
        sleep 6h & wait $${!};
        nginx -s reload;
      done & nginx -g 'daemon off;'"

  certbot:
    container_name: ${CERTBOT_SERVICE_NAME}
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - ./certbot/data/conf:/etc/letsencrypt
      - ./certbot/data/www:/var/www/certbot
    # Attempt renewal every 12h. Let's Encrypt only acts when < 30 days remain.
    entrypoint: >
      /bin/sh -c "trap exit TERM; while :; do
        certbot renew;
        sleep 12h & wait $${!};
      done"
